# Cloudflare Worker for the homepage chat ("Ask about the work").
# Deploy: npx wrangler deploy   (secret once: npx wrangler secret put OPENAI_API_KEY)
name = "liutingchun-com-chat"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# Served at https://liutingchun-com-chat.<account>.workers.dev; no per-version preview URLs.
workers_dev = true
preview_urls = false

# Rebuild the knowledge base from ../wiki before every deploy / dev run.
[build]
command = "python3 ../scripts/build-knowledge.py"
watch_dir = "../wiki"

[vars]
# Which OpenAI model answers (any chat model name from platform.openai.com/docs/models).
MODEL = "gpt-5.4-mini"
# Reasoning before answering. Must be "none" here: OpenAI's chat completions API refuses
# function tools (suggest_links) together with any other reasoning effort on gpt-5.4 models.
# Remove the line for models without reasoning (for example gpt-4.1-mini).
REASONING_EFFORT = "none"
# Pages allowed to call the Worker.
ALLOWED_ORIGINS = "https://liutingchun.com,https://www.liutingchun.com"

# At most 5 questions a minute per visitor (IP), 20 a minute for the whole site.
[[ratelimits]]
name = "PER_VISITOR"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "EVERYONE"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# Chat log: every exchange (question, answer, links, topic, language, country; no IP).
# The deploy workflow creates the database on the first run and fills in its id;
# worker/log-viewer.py shows the entries. `wrangler dev` uses a local copy.
[[d1_databases]]
binding = "DB"
database_name = "liutingchun-chat-log"
database_id = "D1_DATABASE_ID"

[observability]
enabled = true
