# Deploys the homepage chat Worker (worker/) to Cloudflare whenever the
# wiki or the Worker changes. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN  (Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers")
#   OPENAI_API_KEY        (platform.openai.com → API keys)
# Optional: TURNSTILE_SECRET (Cloudflare → Turnstile) turns on the invisible bot check.
# Without them the job is skipped.
name: Deploy chat worker

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "worker/**"
      - "scripts/build-knowledge.py"
      - "scripts/wiki-sitemap.py"
      - "data/site.json"
      - ".github/workflows/deploy-chat.yml"
  workflow_dispatch:

concurrency:
  group: deploy-chat
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_TURNSTILE: ${{ secrets.TURNSTILE_SECRET != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN is not set; skipping the deploy."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: env.HAS_TOKEN == 'true'
        working-directory: worker
        run: npm install --no-audit --no-fund
      # The chat log database (D1): found by name, created on the first run; its id goes
      # into wrangler.toml for this deploy only.
      - if: env.HAS_TOKEN == 'true'
        name: Chat log database
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ID=$(npx wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="liutingchun-chat-log") | .uuid' || true)
          if [ -z "$ID" ]; then
            OUT=$(npx wrangler d1 create liutingchun-chat-log 2>&1 || true)
            ID=$(echo "$OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
            [ -n "$ID" ] && echo "Created D1 database $ID"
          fi
          if [ -n "$ID" ]; then
            sed -i "s/D1_DATABASE_ID/$ID/" wrangler.toml
          else
            # Without the database the chat still deploys, just without the log.
            echo "::warning::No D1 database: the Cloudflare API token needs the permission Account / D1 / Edit. Deploying without the chat log."
            echo "$OUT" | tail -5
            sed -i '/^\[\[d1_databases\]\]/,/^database_id/d' wrangler.toml
          fi
      - if: env.HAS_TOKEN == 'true' && env.HAS_TURNSTILE != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          secrets: |
            OPENAI_API_KEY
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - if: env.HAS_TOKEN == 'true' && env.HAS_TURNSTILE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          secrets: |
            OPENAI_API_KEY
            TURNSTILE_SECRET
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
