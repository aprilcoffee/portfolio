# Deploys the homepage chat Worker (worker/) to Cloudflare whenever the
# wiki or the Worker changes. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN  (Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers")
#   OPENAI_API_KEY        (platform.openai.com → API keys)
# Optional: TURNSTILE_SECRET (Cloudflare → Turnstile) turns on the invisible bot check.
# Without them the job is skipped.
name: Deploy chat worker

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "worker/**"
      - "scripts/build-knowledge.py"
      - "scripts/wiki-sitemap.py"
      - "data/site.json"
      - ".github/workflows/deploy-chat.yml"
  workflow_dispatch:

concurrency:
  group: deploy-chat
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_TURNSTILE: ${{ secrets.TURNSTILE_SECRET != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN is not set; skipping the deploy."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: env.HAS_TOKEN == 'true'
        working-directory: worker
        run: npm install --no-audit --no-fund
      # The chat log database (D1): found by name, created on the first run; its id goes
      # into wrangler.toml for this deploy only.
      - if: env.HAS_TOKEN == 'true'
        name: Chat log database
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          ACC=$(api https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          ID=$(api "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database?name=liutingchun-chat-log" | jq -r '.result[0].uuid // empty')
          if [ -z "$ID" ]; then
            R=$(api -X POST -d '{"name":"liutingchun-chat-log"}' "https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database")
            ID=$(echo "$R" | jq -r '.result.uuid // empty')
            [ -n "$ID" ] && echo "Created D1 database $ID"
          fi
          if [ -n "$ID" ]; then
            sed -i "s/D1_DATABASE_ID/$ID/" worker/wrangler.toml
          else
            # Without the database the chat still deploys, just without the log.
            echo "::warning::No D1 database (the Cloudflare API token needs D1: Edit). Deploying without the chat log. $R"
            sed -i '/^\[\[d1_databases\]\]/,/^database_id/d' worker/wrangler.toml
          fi
      - if: env.HAS_TOKEN == 'true' && env.HAS_TURNSTILE != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          secrets: |
            OPENAI_API_KEY
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - if: env.HAS_TOKEN == 'true' && env.HAS_TURNSTILE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          secrets: |
            OPENAI_API_KEY
            TURNSTILE_SECRET
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
