# Regenerates the static pages whenever the content changes
# (for example after publishing from admin/), and commits the result.
name: Build site

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "posts/**"
      - "scripts/build.py"
      - "assets/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - run: python scripts/build.py
      - name: Commit the generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Pages already up to date"
            exit 0
          fi
          git commit -m "Rebuild pages"
          git pull --rebase origin main
          git push
