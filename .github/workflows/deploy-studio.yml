# Deploys the Worker for the Safety Online workshop tool (worker-studio/) to Cloudflare.
# The page itself is workshops/safety-online/index.html (hand-written, not linked anywhere).
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  (already there for the chat worker)
#   COMFY_KEYS_A          Comfy Cloud API key(s) for group A, comma-separated
#   COMFY_KEYS_B          Comfy Cloud API key(s) for group B, comma-separated
#   CLASS_PASSWORD        the password the students type
# Without them the job is skipped.
name: Deploy studio worker

on:
  push:
    branches: [main]
    paths:
      - "worker-studio/**"
      - ".github/workflows/deploy-studio.yml"
  workflow_dispatch:

concurrency:
  group: deploy-studio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.COMFY_KEYS_A != '' && secrets.COMFY_KEYS_B != '' && secrets.CLASS_PASSWORD != '' }}
    steps:
      - if: env.READY != 'true'
        run: echo "CLOUDFLARE_API_TOKEN, COMFY_KEYS_A, COMFY_KEYS_B or CLASS_PASSWORD is not set; skipping the deploy."
      - if: env.READY == 'true'
        uses: actions/checkout@v4
      - if: env.READY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: env.READY == 'true'
        working-directory: worker-studio
        run: npm install --no-audit --no-fund
      - if: env.READY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker-studio
          secrets: |
            COMFY_KEYS_A
            COMFY_KEYS_B
            CLASS_PASSWORD
        env:
          COMFY_KEYS_A: ${{ secrets.COMFY_KEYS_A }}
          COMFY_KEYS_B: ${{ secrets.COMFY_KEYS_B }}
          CLASS_PASSWORD: ${{ secrets.CLASS_PASSWORD }}
